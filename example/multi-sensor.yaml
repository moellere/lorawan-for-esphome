# Multiple sensor values in one uplink. Shows the binding pattern: define real
# sensors with ids, then add one `platform: lorawan` entry per value -- the order
# of those entries is the byte order in the payload.
#
# Payload here: 4 bytes, little-endian
#   bytes 0-1: battery, uint16, millivolts (volts x 1000)
#   bytes 2-3: cpu_temp, int16, hundredths of a degree (C x 100)
#
# Matching ChirpStack decodeUplink (keep in lockstep -- see codec/decodeUplink.js):
#   var FIELDS = [
#     { name: "battery", type: "uint16", multiplier: 1000 },
#     { name: "cpu_temp", type: "int16", multiplier: 100 },
#   ];
#
# US915 DR0 carries 11 bytes, so there is room for more fields -- see README
# "Payload encoding".

esphome:
  name: lorawan-multi

esp32:
  board: ttgo-lora32-v1
  framework:
    type: arduino

logger:

external_components:
  - source: github://moellere/lorawan-for-esphome@main  # pin a commit for real use
    components: [lorawan]

sensor:
  # Real sensors -- any ESPHome sensor platform works, including template/computed
  # sensors. Each needs an id and should update at least as often as the uplink.
  - platform: adc
    pin: GPIO36
    id: battery
    update_interval: 60s
  - platform: internal_temperature
    id: cpu_temp
    update_interval: 60s

  # Bind each into the uplink, in payload order.
  - platform: lorawan
    lorawan_id: lw
    sensor: battery
    type: uint16
    multiplier: 1000
  - platform: lorawan
    lorawan_id: lw
    sensor: cpu_temp
    type: int16
    multiplier: 100

spi:
  clk_pin: GPIO5
  miso_pin: GPIO19
  mosi_pin: GPIO27

lorawan:
  id: lw
  region: US915
  sub_band: 2
  dev_eui: !secret dev_eui
  join_eui: !secret join_eui
  app_key: !secret app_key
  uplink_interval: 15min
  radio:
    chip: sx1276
    cs_pin: GPIO18
    rst_pin: GPIO23
    dio0_pin: GPIO26
