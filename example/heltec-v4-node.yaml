# Heltec WiFi LoRa 32 V4 -- validated pin map (HIL session 2026-08-27).
#
# The V4 ships in two FEM revisions and this config drives the superset:
#   V4.2 (GC1109):   GPIO7=VFEM LDO, GPIO2=CSD, GPIO46=CPS (full PA),
#                    SX1262 DIO2 -> CTX (TX/RX select, automatic)
#   V4.3 (KCT8103L): GPIO7=VFEM LDO, GPIO2=CSD, GPIO5=CTX (TX-PA / RX-bypass),
#                    SX1262 DIO2 -> CPS (TX/RX select, automatic)
# Plus VEXT (GPIO36, ACTIVE LOW) which powers the FEM/antenna path -- leaving
# it undriven produces leakage-grade TX (about -52 dBm at 2 m from a 28 dBm
# board) and can mask every other front-end mistake.
#
# Truth tables and sources: Meshtastic variants/esp32s3/heltec_v4/variant.h,
# MeshCore PR #1249, RadioLib discussion #1665.
#
# PICK THE PA PIN BY REVISION (measured 2026-10-24, HANDOFF.md "The bench V4
# is a V4.3"): on a V4.2 the full PA is enabled by GPIO46 (GC1109 CPS); on a
# V4.3 it is GPIO5 (KCT8103L CTX). The wrong one does not break the link at
# bench range, it just transmits with the PA bypassed -- about 45-50 dB down
# at the gateway -- so a board that "works on the bench" can still have no
# range. Set pa_pin below to match the board.
substitutions:
  pa_pin: GPIO46   # V4.2 (GC1109). Use GPIO5 on a V4.3 (KCT8103L).

esphome:
  name: heltec-v4-node

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: arduino
  variant: ESP32S3

logger:
  baud_rate: 115200

external_components:
  - source:
      type: local
      path: /home/moellere/repos/lorawan-for-esphome/components
    components: [lorawan]

sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery"
    id: battery
    update_interval: 60s
  - platform: lorawan
    lorawan_id: lw
    sensor: battery

spi:
  clk_pin: GPIO9
  miso_pin: GPIO11
  mosi_pin: GPIO10

lorawan:
  id: lw
  region: US915
  sub_band: 2
  dev_eui: !secret dev_eui   # per-device; see README "Per-device keys"
  join_eui: !secret join_eui
  app_key: !secret app_key
  uplink_interval: 1min
  radio:
    chip: sx1262
    cs_pin: GPIO8
    rst_pin: GPIO12
    dio1_pin: GPIO14
    busy_pin: GPIO13
    tcxo_voltage: 1.8
    dio2_as_rf_switch: true
    # Bench-proven V4 recipe (OTAA join, uplink and downlink on the Wyola
    # workbench, 2026-08-28 and 2026-10-24):
    #   static high:  GPIO7 (VFEM LDO), GPIO2 (FEM chip enable / CSD)
    #   static low:   GPIO36 (VEXT, active low -- powers the FEM/antenna path)
    #   per-transfer: ${pa_pin} via txen_pin -- RadioLib raises it only while
    #                 transmitting, so the PA is on for TX and out of the way
    #                 for RX. V4.2: GPIO46 (GC1109 CPS). V4.3: GPIO5
    #                 (KCT8103L CTX). Do not hold it high with setup_high: on a
    #                 V4.3 that keeps the TX path selected while receiving.
    #   DIO2          TX/RX antenna select -- automatic (dio2_as_rf_switch)
    setup_high: [GPIO7, GPIO2]
    setup_low: [GPIO36]
    txen_pin: ${pa_pin}
