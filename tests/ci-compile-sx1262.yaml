# CI-only config for the SX1262 path, alongside the SX1276 one. Modelled on a
# Heltec WiFi LoRa 32 V4: an ESP32-S3 with an SX1262 behind an external PA.
#
# It exercises the three keys the SX1276 config cannot reach -- tcxo_voltage,
# dio2_as_rf_switch and setup_high -- because every one of them fails silently
# on hardware. A board with an unpowered front end still returns OK from
# begin() and still reports uplinks as sent; the only symptom is that nothing
# ever arrives at the gateway. A compile gate cannot catch that, but it can at
# least keep the config surface from regressing.
#
# Keys are placeholders from tests/secrets.yaml; this build never joins.
#
# Also exercises the application-payload surface the SX1276 config leaves
# alone: device_class C, lorawan.send_raw (literal + lambda payloads), and
# on_downlink.
esphome:
  name: lorawan-ci-sx1262

interval:
  - interval: 10min
    then:
      - lorawan.send_raw:
          id: lw
          f_port: 10
          payload: [0x01, 0x02, 0x03]
  - interval: 15min
    then:
      - lorawan.send_raw:
          id: lw
          f_port: !lambda "return 10;"
          payload: !lambda |-
            std::vector<uint8_t> p;
            p.push_back(0x2a);
            return p;

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: arduino
  variant: ESP32S3

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [lorawan]

# Three payload fields on purpose: 3 x float32 = 12 bytes, one byte over the
# 11-byte US915 DR0 limit. That is the shape that uplinks a couple of times and
# then fails with -4 forever once ADR settles the rate down, so keep the
# multi-field path compiled.
sensor:
  - platform: adc
    pin: GPIO1
    name: "Battery"
    id: battery
    update_interval: 60s
  - platform: template
    name: "Second"
    id: second_field
    lambda: "return 1.0;"
  - platform: template
    name: "Third"
    id: third_field
    lambda: "return 2.0;"
  - platform: lorawan
    lorawan_id: lw
    sensor: battery
  - platform: lorawan
    lorawan_id: lw
    sensor: second_field
  - platform: lorawan
    lorawan_id: lw
    sensor: third_field

lorawan:
  id: lw
  region: US915
  sub_band: 2
  dev_eui: !secret dev_eui
  join_eui: !secret join_eui
  app_key: !secret app_key
  uplink_interval: 5min
  # Continuous receive between uplinks; downlinks land in seconds.
  device_class: C
  on_downlink:
    - lambda: |-
        ESP_LOGD("ci", "downlink port=%u len=%u", port, (unsigned) payload.size());
  radio:
    chip: sx1262
    cs_pin: GPIO8
    rst_pin: GPIO12
    dio1_pin: GPIO14
    busy_pin: GPIO13
    sck_pin: GPIO9
    miso_pin: GPIO11
    mosi_pin: GPIO10
    # The SX1262 powers its oscillator from DIO3; the wrong voltage means the
    # chip never clocks and begin() fails ERR_SPI_CMD_TIMEOUT.
    tcxo_voltage: 1.8
    # Antenna switch on DIO2 rather than a GPIO.
    dio2_as_rf_switch: true
    # Front-end power, enable, CTX and PA-mode select. Undriven, the radio is
    # deaf and the failure is invisible from the device side.
    setup_high: [GPIO7, GPIO2, GPIO5, GPIO46]
    # VEXT-class active-low rail (V4: GPIO36 powers the FEM/antenna path)
    setup_low: [GPIO36]
