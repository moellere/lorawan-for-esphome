name: CI

on:
  push:
  pull_request:

jobs:
  compile:
    name: esphome compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The firmware's payload encoder against the ChirpStack decoder, on the
      # host: no ESPHome needed, so it runs first.
      - name: Codec round-trip
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Icomponents/lorawan -o /tmp/vectors tests/codec/vectors.cpp
          /tmp/vectors | node tests/codec/check.js

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pin ESPHome: the C++ is built against a specific external API surface.
      - name: Install ESPHome
        run: pip install esphome==2026.6.1

      - name: Write placeholder secrets
        run: |
          cat > tests/secrets.yaml <<'EOF'
          dev_eui: "0011223344556677"
          join_eui: "0000000000000000"
          app_key: "00112233445566778899aabbccddeeff"
          EOF

      - name: Compile (SX1276)
        run: esphome compile tests/ci-compile.yaml

      # Separate config because the SX1262 keys -- tcxo_voltage,
      # dio2_as_rf_switch, setup_high -- do not exist on the SX1276 path, and
      # every one of them fails silently on hardware if wrong.
      - name: Compile (SX1262 + TCXO/PA)
        run: esphome compile tests/ci-compile-sx1262.yaml

      # The radio HAL sits on ESPHome's SPI/GPIO, so the component must also
      # build without Arduino.
      - name: Compile (SX1262, ESP-IDF)
        run: esphome compile tests/ci-compile-idf.yaml
